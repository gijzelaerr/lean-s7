name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native-library: libsnap7.so
          - os: macos-latest
            native-library: libsnap7.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: lean-s7 lean-s7-tests lean-s7-conformance lean-s7-fuzz lean-s7-axioms
      - run: lake exe lean-s7-tests
      - run: lake exe lean-s7-axioms
      - run: lake exe lean-s7-conformance | diff - conformance/v1/tpkt.json
      - run: lake exe lean-s7-conformance cotp | diff - conformance/v1/cotp-data.json
      - run: lake exe lean-s7-conformance s7 | diff - conformance/v1/s7.json
      - run: lake exe lean-s7-conformance operations | diff - conformance/v1/operations.json
      - run: lake exe lean-s7-conformance values | diff - conformance/v1/values.json
      - run: lake exe lean-s7-conformance conversations | diff - conformance/v1/conversations.json
      - run: lake exe lean-s7-conformance sessions | diff - conformance/v1/sessions.json
      - run: lake exe lean-s7-conformance management | diff - conformance/v1/management.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "python-snap7==3.0.0" "ruff==0.16.8"
      - run: ruff check integration
      - run: ruff format --check integration
      - run: python integration/python_snap7_consumer.py
      - run: python integration/run.py
      - run: python integration/native_snap7_build.py
      - run: python integration/native_snap7.py --library ".lake/native-snap7/${{ matrix.native-library }}"
