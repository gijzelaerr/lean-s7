name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: lean-s7 lean-s7-tests lean-s7-conformance
      - run: lake exe lean-s7-tests
      - run: lake exe lean-s7-conformance | diff - conformance/v1/tpkt.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "python-snap7==3.0.0"
      - run: python integration/run.py
