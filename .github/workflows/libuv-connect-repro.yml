name: libuv connect reproducer

# Issue #58 / leanprover/lean4#15807: the stack-cookie failure in uv__tcp_connect.
#
# The first run (commit b58d10a, run 40693151518) showed the crash reproduces
# with libuv alone (libuv 1.52.1, also Lean 4.33.1's libuv.a), is not removed by
# changing the ConnectEx byte counter, and did not occur with libuv 1.53.0. Between
# those releases, libuv commit aabb7651d (#5107, fixing libuv/libuv#5106)
# initialises the OSVERSIONINFOW passed to RtlGetVersion in uv__windows10_version1709,
# which uv__tcp_connect calls for every loopback connect.
#
# Arms, all driven identically (diagnostics/libuv-connect-repro/drive.py):
#   c-src       libuv 1.52.1 built with MSYS2's hardening flags (control)
#   c-osfix     the same, with only commit aabb7651d applied
#   c-lean435   the libuv.a shipped in the Lean 4.35.0 release

on:
  workflow_dispatch:
  push:
    branches:
      - diag/libuv-connectex

permissions:
  contents: read

jobs:
  repro:
    name: ${{ matrix.arm }} (shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arm: [c-src, c-osfix, c-lean435]
        shard: [1, 2, 3]
    env:
      LIBUV_VERSION: "1.52.1"
      LEAN_RELEASE: "4.35.0"
      HARDENING: "-O2 -Wp,-D_FORTIFY_SOURCE=2 -fstack-protector-strong"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja

      - name: Fetch the libuv.a Lean ships
        if: matrix.arm == 'c-lean435'
        run: |
          curl -fsSL -o lean.zip "https://github.com/leanprover/lean4/releases/download/v${LEAN_RELEASE}/lean-${LEAN_RELEASE}-windows.zip"
          unzip -q -j lean.zip '*/lib/libuv.a' -d uv-lean
          curl -fsSL "https://github.com/libuv/libuv/archive/refs/tags/v${LIBUV_VERSION}.tar.gz" | tar xz
          mkdir -p uv/lib && cp uv-lean/libuv.a uv/lib/ && cp -r "libuv-${LIBUV_VERSION}/include" uv/
      - name: Fetch libuv source
        if: matrix.arm != 'c-lean435'
        run: |
          curl -fsSL "https://github.com/libuv/libuv/archive/refs/tags/v${LIBUV_VERSION}.tar.gz" | tar xz
          if [ "${{ matrix.arm }}" = c-osfix ]; then
            python diagnostics/libuv-connect-repro/patch_osversion.py "libuv-${LIBUV_VERSION}"
          fi
          grep -n -A6 'static int uv__windows10_version1709' "libuv-${LIBUV_VERSION}/src/win/tcp.c"
      - name: Build libuv from source
        if: matrix.arm != 'c-lean435'
        shell: msys2 {0}
        run: |
          cmake -S "libuv-${LIBUV_VERSION}" -B uv-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_C_FLAGS="${HARDENING}" \
            -DLIBUV_BUILD_SHARED=OFF -DLIBUV_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/uv"
          cmake --build uv-build
          cmake --install uv-build
      - name: Build the C reproducer
        shell: msys2 {0}
        run: |
          uv_lib="$(find uv/lib -name 'libuv*.a' | head -1)"
          clang ${HARDENING} -g diagnostics/libuv-connect-repro/connect_repro.c -Iuv/include "${uv_lib}" \
            -lws2_32 -liphlpapi -luserenv -ldbghelp -lole32 -lshell32 -luser32 -ladvapi32 -lpsapi \
            -static -o connect_repro.exe
          ./connect_repro.exe --version
          echo "REPRO_EXE=$(cygpath -w "$PWD/connect_repro.exe")" >> "$GITHUB_ENV"

      - name: Fetch ProcDump
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile "$env:RUNNER_TEMP\procdump.zip"
          Expand-Archive "$env:RUNNER_TEMP\procdump.zip" -DestinationPath "$env:RUNNER_TEMP\procdump"
      - name: Connect in a loop
        run: |
          python diagnostics/libuv-connect-repro/drive.py "${{ matrix.arm }}" "$REPRO_EXE" \
            "$RUNNER_TEMP/dumps" "$RUNNER_TEMP/procdump/procdump64.exe" 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libuv-connect-${{ matrix.arm }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/dumps
            ${{ env.REPRO_EXE }}
          if-no-files-found: warn
